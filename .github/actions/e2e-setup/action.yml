name: e2e setup
description: Node, the npm install and one engine's browser, ready for `playwright test`.
inputs:
  engine:
    description: chromium, firefox or webkit, as `ENGINE` in playwright.config.ts
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - run: npm ci
      shell: bash
    - run: echo "PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_ENV"
      shell: bash
    # Playwright's own image ships the browsers and their OS packages (it sets
    # PLAYWRIGHT_BROWSERS_PATH, which only a shell sees); anywhere else, cache the download and
    # install both.
    - id: image
      run: echo "ships=$([ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: inputs.engine != 'firefox' && steps.image.outputs.ships != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-${{ inputs.engine }}-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
    - if: inputs.engine != 'firefox' && steps.image.outputs.ships != 'true'
      run: npx playwright install --with-deps ${{ inputs.engine }}
      shell: bash
    # Firefox is Mozilla's own release, pinned, not Playwright's patched build: the suite drives the
    # browser users run. The `firefox` job in ci.yml unpacks it once; the image has its OS packages.
    - if: inputs.engine == 'firefox'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: firefox-linux
        path: ${{ runner.temp }}
    - if: inputs.engine == 'firefox'
      run: |
        tar -xzf "$RUNNER_TEMP/firefox.tar.gz" -C "$RUNNER_TEMP"
        echo "FIREFOX_PATH=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
        echo "Firefox: $("$RUNNER_TEMP/firefox/firefox" --version)" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
