name: measure test speed
# Temporary probe for the ci/test-speed lane, removed before it merges.
on:
  push:
    branches: [ci/test-speed]

permissions:
  contents: read

jobs:
  nav-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        waitUntil: [domcontentloaded, load]
    env:
      ENGINE: firefox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/e2e-setup
        with:
          engine: firefox
      - run: sed -i "s/const NAVIGATED = 'domcontentloaded'/const NAVIGATED = '${{ matrix.waitUntil }}'/" src/lib/e2e/goto-ready.ts && grep -n "const NAVIGATED" src/lib/e2e/goto-ready.ts
      - run: npx playwright test text-editing/whole-block-printable-mint.spec.ts text-editing/whole-block-ime-mint.spec.ts --repeat-each=30 --workers=4 --trace=retain-on-failure
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nav-probe-${{ matrix.waitUntil }}
          path: test-results/
