name: WebKit macOS
# Playwright's WebKit on macOS, the nearest a runner gets to Safari's own key bindings and fonts
# (docs/contributing/testing.md § Browser engines). macOS runners are few, so it runs nightly on
# dev and on the way into main, not on every dev push. Its checks don't block a merge until it
# runs clean (PENDING_GATE_CONTEXTS in scripts/branch-protection-contexts.mjs).
on:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main, ci/engine-matrix]
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions pinned to commit SHAs (a major tag is mutable); bump SHA and comment together.
jobs:
  e2e-webkit-macos:
    runs-on: macos-latest
    env:
      ENGINE: webkit
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/5', '2/5', '3/5', '4/5', '5/5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A scheduled run starts from main's copy of this file; the nightly tests dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: ./.github/actions/e2e-setup
        with:
          engine: webkit
      - run: npx playwright test --shard=${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-webkit-macos-${{ strategy.job-index }}
          path: test-results/ci-summary.json
